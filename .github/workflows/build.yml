name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AppImage de Linux (linux/appimage/build.sh)
        run: |
          linux/appimage/build.sh
          cd dist && sha256sum ClassicForever-x86_64.AppImage > ClassicForever-x86_64.AppImage.sha256

      - name: Addons del servidor (addons/<nombre> -> dist/<nombre>.zip, los instala el launcher)
        run: |
          cd addons
          for d in */; do
            n="${d%/}"
            zip -qrX "../dist/$n.zip" "$n"
            (cd ../dist && sha256sum "$n.zip" > "$n.zip.sha256")
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ClassicForever-AppImage
          path: |
            dist/ClassicForever-x86_64.AppImage*
            dist/*.zip*

  build:
    needs: appimage
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ClassicForever-AppImage
          path: dist

      - name: Compilar (csc de .NET Framework 4.8, el mismo que build.cmd)
        shell: cmd
        run: build.cmd

      - name: SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/ClassicForever.exe -Algorithm SHA256).Hash.ToLower()
          "$h  ClassicForever.exe" | Out-File -Encoding ascii dist/ClassicForever.exe.sha256
          Write-Host "SHA-256: $h"
          "SHA256=$h" >> $env:GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: ClassicForever
          path: dist/ClassicForever.exe*

      - name: Publicar release (solo tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = @"
          Compilado por GitHub Actions desde el commit $env:GITHUB_SHA ([registro del build]($env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID)).

          **SHA-256:** ``$env:SHA256``

          **Linux:** ``ClassicForever-x86_64.AppImage`` (dale permiso de ejecución y ábrela; SHA-256 en el ``.sha256``). El parcheador suelto para Steam sigue siendo ``classic-forever-linux.py``.

          Windows mostrará "Windows protegió su PC" porque el ejecutable no está firmado: pulsa **Más información → Ejecutar de todas formas**. Ver el README.
          "@
          $addons = (Get-ChildItem dist/*.zip, dist/*.zip.sha256).FullName
          gh release create $env:GITHUB_REF_NAME dist/ClassicForever.exe dist/ClassicForever.exe.sha256 dist/ClassicForever-x86_64.AppImage dist/ClassicForever-x86_64.AppImage.sha256 linux/classic-forever-linux.py @addons --title "Classic Forever Launcher $env:GITHUB_REF_NAME" --notes $notes
